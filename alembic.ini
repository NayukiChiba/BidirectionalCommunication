# Alembic reads this file with the Windows system encoding.
# Keep comments in this file ASCII so the CLI works on every developer machine.

# Alembic's own configuration section.
# script_location and prepend_sys_path live in pyproject.toml.
[alembic]

# sqlalchemy.url is intentionally absent here.
# migrations/env.py loads DATABASE_URL through src.config.DatabaseSettings.
# Tests override it with Alembic Config.set_main_option().


# Names of the logger definitions Alembic should configure.
[loggers]
keys = root,sqlalchemy,alembic

# Names of the output handlers used by those loggers.
[handlers]
keys = console

# Names of the log message layouts used by handlers.
[formatters]
keys = generic

# Default logger: only show warnings and errors.
[logger_root]
level = WARNING
handlers = console
qualname =

# SQLAlchemy engine logger: keep generated SQL quiet by default.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# Alembic logger: show revision upgrade and downgrade progress.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Send log records to standard error in the current terminal.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Format used by the console handler.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
