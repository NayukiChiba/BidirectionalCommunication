x-app-environment: &app-environment
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?请在.env中设置至少32字节的随机密钥}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:?请在.env中设置PostgreSQL密码}@postgres:5432/${POSTGRES_DB:-chat}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  REDIS_URL: redis://redis:6379/0
  REDIS_PRESENCE_LEASE_SECONDS: ${REDIS_PRESENCE_LEASE_SECONDS:-30}
  REDIS_PRESENCE_REFRESH_SECONDS: ${REDIS_PRESENCE_REFRESH_SECONDS:-10}
  REDIS_SUBSCRIBER_RETRY_SECONDS: ${REDIS_SUBSCRIBER_RETRY_SECONDS:-1}
  REDIS_OPERATION_TIMEOUT_SECONDS: ${REDIS_OPERATION_TIMEOUT_SECONDS:-1}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
  REDIS_CHANNEL_PREFIX: ${REDIS_CHANNEL_PREFIX:-bidirectional-chat}
  REDIS_RECENT_EVENT_TTL_SECONDS: ${REDIS_RECENT_EVENT_TTL_SECONDS:-60}
  REDIS_RECENT_EVENT_LIMIT: ${REDIS_RECENT_EVENT_LIMIT:-10000}
  AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  WS_MAX_MESSAGE_BYTES: ${WS_MAX_MESSAGE_BYTES:-16384}
  WS_INPUT_RATE_LIMIT_COUNT: ${WS_INPUT_RATE_LIMIT_COUNT:-30}
  WS_INPUT_RATE_LIMIT_WINDOW_SECONDS: ${WS_INPUT_RATE_LIMIT_WINDOW_SECONDS:-10}
  WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-1000}
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-common: &app-common
  image: bidirectionalcommunication:local
  depends_on:
    migrate:
      condition: service_completed_successfully
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 15s
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
      ]
    interval: 10s
    timeout: 3s
    start_period: 10s
    retries: 3

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env中设置PostgreSQL密码}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-chat} -d ${POSTGRES_DB:-chat}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 10s

  migrate:
    image: bidirectionalcommunication:local
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:?请在.env中设置PostgreSQL密码}@postgres:5432/${POSTGRES_DB:-chat}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-common
    build:
      context: .
      target: runtime
    environment:
      <<: *app-environment
      INSTANCE_ID: app-a
    ports:
      - "${APP_PORT:-8000}:8000"

  app-b:
    <<: *app-common
    profiles: ["multi-instance"]
    environment:
      <<: *app-environment
      INSTANCE_ID: app-b
    ports:
      - "${APP_SECONDARY_PORT:-8001}:8000"

volumes:
  postgres-data:
