name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project and test dependencies
        run: python -m pip install . pytest pytest-asyncio
      - name: Run tests
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project and audit tool
        run: python -m pip install . pip-audit
      - name: Audit Python dependencies
        run: pip-audit . --progress-spinner off --strict
