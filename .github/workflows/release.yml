name: 发布 GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "需要补发 Release 的现有标签"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 创建 Release
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: 检出发布配置
        uses: actions/checkout@v6

      - name: 检查发布说明
        run: |
          changelog_path="changelogs/${TAG_NAME}.md"
          if [[ ! -f "${changelog_path}" ]]; then
            echo "::error file=${changelog_path}::找不到标签对应的发布说明"
            exit 1
          fi

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "BidirectionalCommunication ${TAG_NAME}" \
            --notes-file "changelogs/${TAG_NAME}.md" \
            --verify-tag \
            --latest
