name: 构建桌面端并发布 GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: 构建 Windows 桌面端
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: 检出标签代码
        uses: actions/checkout@v6

      - name: 校验标签与应用版本
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMatch = Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$'
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value
          $releaseVersion = $env:RELEASE_TAG.TrimStart("v")
          $semanticVersion = if ($releaseVersion -match '^\d+\.\d+$') {
            "$releaseVersion.0"
          } else {
            $releaseVersion
          }
          if ($semanticVersion -ne $packageVersion -or
              $semanticVersion -ne $tauriVersion -or
              $semanticVersion -ne $cargoVersion) {
            Write-Error "标签版本 $releaseVersion 与桌面应用版本不一致"
            exit 1
          }

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 配置 uv 和 Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装后端构建依赖
        run: uv sync --locked --dev

      - name: 配置 Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: 缓存 Rust 构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: windows-tauri-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-tauri-

      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci

      - name: 清理缓存中的旧安装程序
        shell: pwsh
        run: |
          $bundlePath = Join-Path $env:GITHUB_WORKSPACE "desktop/src-tauri/target/release/bundle"
          if (Test-Path -LiteralPath $bundlePath) {
            Remove-Item -LiteralPath $bundlePath -Recurse -Force
          }

      - name: 运行前端测试
        working-directory: desktop
        run: npm test

      - name: 构建纯客户端 NSIS 安装程序
        working-directory: desktop
        run: npm run tauri:build:client

      - name: 构建内置后端 NSIS 安装程序
        working-directory: desktop
        run: npm run tauri:build:standalone

      - name: 使用发布版本重命名安装程序
        working-directory: desktop
        run: npm run release:rename

      - name: 验证内置后端
        working-directory: desktop
        run: npm run backend:test

      - name: 上传 Windows 安装程序
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: 创建 GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest

    steps:
      - name: 检出发布说明
        uses: actions/checkout@v6

      - name: 下载 Windows 安装程序
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: release-assets

      - name: 创建 Release 并上传安装程序
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changelog_path="changelogs/${GITHUB_REF_NAME}.md"
          if [[ -f "${changelog_path}" ]]; then
            gh release create "${GITHUB_REF_NAME}" release-assets/*.exe \
              --repo "${GITHUB_REPOSITORY}" \
              --title "BidirectionalCommunication ${GITHUB_REF_NAME}" \
              --notes-file "${changelog_path}" \
              --verify-tag \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/*.exe \
              --repo "${GITHUB_REPOSITORY}" \
              --title "BidirectionalCommunication ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
